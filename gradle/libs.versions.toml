[versions]
# The library compiles against the oldest supported JavaFX, so newer APIs cannot slip in.
javafxMin = "21.0.13"
# The demo runs on a current JavaFX.
javafx = "25"
junit = "5.13.4"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
